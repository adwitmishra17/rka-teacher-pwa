<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Teacher PWA — offline</title>
    <style>
      body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
             background:#faf9f5; color:#1c1c1e; text-align:center; padding:24px;
             font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }
      .card { max-width:340px; }
      img { width:76px; height:76px; margin-bottom:18px; }
      h1 { font-size:19px; margin:0 0 8px; color:#1a4a2e; }
      p  { font-size:14px; line-height:1.55; color:#6b7280; margin:0 0 18px; }
      button { padding:11px 20px; border:none; border-radius:8px; background:#1a4a2e;
               color:#fff; font-size:14.5px; font-weight:600; cursor:pointer; }
    </style>
  </head>
  <body>
    <div class="card">
      <img src="/icon-192.png" alt="Radhakrishna Academy" />
      <h1>You're offline</h1>
      <p>Teacher PWA needs an internet connection. Reconnect and try again.</p>
      <button onclick="location.reload()">Retry</button>
    </div>
  </body>
</html>
